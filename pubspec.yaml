name: findit_mobile
description: "FindIT - Campus Lost and Found Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/Kampus/
